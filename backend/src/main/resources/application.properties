# Secrets (database password, Gemini API key, JWT signer key) are intentionally empty here.
# Set them in backend/.env — see backend/.env.example.
spring.application.name=disease_prediction_backend
spring.datasource.url=jdbc:mysql://localhost:3306/medical_diagnosis
spring.datasource.username=root
spring.datasource.password=
# spring.datasource.username=root
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA properties
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# mongodb
spring.data.mongodb.uri= mongodb://localhost:27017/sids

gemini.api.key=
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

jwt.signerKey=
jwt.valid-duration=86400
jwt.refreshable-duration=604800